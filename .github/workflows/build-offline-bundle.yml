name: Build Hermes Agent Offline Bundle (ARM64)

# 为什么是"arm64 runner + manylinux 容器"这两层，而不是随便一层：
#
#   ubuntu-24.04-arm runner 本体    glibc 2.39  → 在这里编译原生扩展，
#                                               产物链接到 2.39，拷到信创机
#                                               （2.28）必然 GLIBC_2.39 not found
#   quay.io/pypa/manylinux_2_28_aarch64  glibc 2.28 + 自带 gcc
#
# 结论：**runner 只负责提供架构，容器负责提供 glibc 基线。** 缺一不可。
# 两者都满足时，PEP 508 环境标记天然按 linux/aarch64 求值，
# 不需要任何 --platform / marker 劫持那套交叉 hack。

on:
  workflow_dispatch:
    inputs:
      hermes_commit:
        description: 'hermes-agent 提交 SHA（留空 = main 尖端）'
        required: false
        default: ''
      python_version:
        description: '目标 Python 版本'
        required: false
        default: '3.11'
      node_line:
        description: 'Node 主版本线（24 或 22）'
        required: false
        default: '24'
      glibc:
        description: '目标 glibc 基线（2.28=信创 / 2.17=更老）'
        required: false
        default: '2.28'
      pypi_index:
        description: 'PyPI 镜像 URL（留空 = 官方源）'
        required: false
        default: ''
      skip_playwright:
        description: '跳过 Playwright/Chromium（包体积小很多）'
        type: boolean
        default: false
      skip_media:
        description: '跳过 ripgrep/ffmpeg'
        type: boolean
        default: false
      skip_desktop:
        description: '跳过 Hermes Desktop（Electron 桌面壳，打包耗时且体积大）'
        type: boolean
        default: false
  push:
    tags:
      - 'bundle-*'

permissions:
  contents: write

concurrency:
  group: offline-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # 公开仓库的 arm64 runner 免费且不限额度；私有仓库会消耗 Actions 额度
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240

    steps:
      - name: 检出构建脚本
        uses: actions/checkout@v4

      # ── 静态检查放在拉镜像之前 ──
      # 这几项都是毫秒级/秒级，却能在几十分钟的构建开跑之前，
      # 拦下"语法合法但引用了不存在的函数"这类在流水线后段才会炸的错误。
      - name: 静态检查（秒级）
        run: |
          set -euo pipefail
          echo "── AST 未定义名检查 ──"
          python3 build/check_undefined.py \
              build/build_bundle.py build/test_native_mode.py \
              build/check_undefined.py build/gh_run.py build/test_workflow.py \
              build/push_api.py build/test_push_api.py build/test_download.py \
              build/test_web_ui.py build/test_desktop.py
          echo ""
          echo "── 原生模式参数不变量（锁死 pip 调用参数）──"
          python3 build/test_native_mode.py
          echo ""
          echo "── dashboard 前端预编译不变量（锁死离线可用的 Web UI）──"
          python3 build/test_web_ui.py
          echo ""
          echo "── Hermes Desktop 预打包不变量（锁死离线可用的 Electron 壳）──"
          python3 build/test_desktop.py
          echo ""
          echo "── 工作流自检（YAML / run 块语法 / inputs 引用 / pipefail 陷阱）──"
          python3 build/test_workflow.py
          echo ""
          echo "── 推送工具自测（blob 批量解析逐字节校验）──"
          python3 build/test_push_api.py
          echo ""
          echo "── 下载器自测（多分片并发 / 续传 / 拼接）──"
          python3 build/test_download.py
          echo ""
          echo "── shell 语法 ──"
          bash -n build/ci-entry.sh
          bash -n target/install.sh
          bash -n target/check-env.sh
          echo "✓ 全部通过"

      - name: 容器内原生构建（manylinux_2_28_aarch64）
        env:
          HERMES_COMMIT: ${{ github.event.inputs.hermes_commit }}
          PY_VERSION: ${{ github.event.inputs.python_version }}
          NODE_LINE: ${{ github.event.inputs.node_line }}
          GLIBC: ${{ github.event.inputs.glibc }}
          PYPI_INDEX: ${{ github.event.inputs.pypi_index }}
          SKIP_PLAYWRIGHT: ${{ github.event.inputs.skip_playwright }}
          SKIP_MEDIA: ${{ github.event.inputs.skip_media }}
          SKIP_DESKTOP: ${{ github.event.inputs.skip_desktop }}
        run: |
          set -euo pipefail
          # 这些 input 在 push 触发时是空串，ci-entry.sh 里各自有默认值。
          # 空串传进去不会覆盖默认值（用的 ${VAR:-default} 语义）。
          [ "$SKIP_PLAYWRIGHT" = "true" ] || SKIP_PLAYWRIGHT=""
          [ "$SKIP_MEDIA" = "true" ] || SKIP_MEDIA=""
          [ "$SKIP_DESKTOP" = "true" ] || SKIP_DESKTOP=""

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e HERMES_COMMIT \
            -e PY_VERSION \
            -e NODE_LINE \
            -e GLIBC \
            -e PYPI_INDEX \
            -e SKIP_PLAYWRIGHT \
            -e SKIP_MEDIA \
            -e SKIP_DESKTOP \
            -e GITHUB_TOKEN \
            quay.io/pypa/manylinux_2_28_aarch64 \
            bash /work/build/ci-entry.sh

      - name: 校验产物
        env:
          SKIP_PLAYWRIGHT: ${{ github.event.inputs.skip_playwright }}
          GLIBC_TARGET: ${{ github.event.inputs.glibc }}
        run: |
          set -euo pipefail
          TB=dist/hermes-offline-arm64.tar.gz
          test -f "$TB" || { echo "✗ 没有产出 $TB" >&2; exit 1; }
          test -f dist/hermes-offline-arm64/build-info.json || { echo "✗ 缺少 build-info.json" >&2; exit 1; }
          test -f dist/hermes-offline-arm64/MANIFEST.sha256 || { echo "✗ 缺少 MANIFEST.sha256" >&2; exit 1; }

          # 清单必须先落成文件再消费。
          # 绝不能写 `tar -tzf "$TB" | head -40`：head 读满 40 行就退出并关闭
          # 管道，tar 随即收到 EPIPE（"tar: stdout: write error"，退出码 2），
          # 再被 `set -o pipefail` 放大成整条流水线失败。结果是包明明完好，
          # 报错却落在「校验产物」这一步，极易误判成构建失败。
          # 同理 `grep -q` 也是提前退出的消费者：`tar -tzf | grep -qx` 一样
          # 会把 tar 打成 EPIPE。改成从普通文件读，就没有上游写入者了。
          LIST=$(mktemp)
          REPO_TGZ=$(mktemp)
          REPO_LIST=$(mktemp)
          DT_TGZ=$(mktemp)
          DT_LIST=$(mktemp)
          trap 'rm -f "$LIST" "$REPO_TGZ" "$REPO_LIST" "$DT_TGZ" "$DT_LIST"' EXIT
          tar -tzf "$TB" > "$LIST"

          echo "── 结构抽检 ──"
          head -40 "$LIST" | sed 's/^/  /'
          echo "  …"
          N=$(wc -l < "$LIST")
          echo "  条目总数: $N"

          # 关键条目必须都在
          musts="
          hermes-offline-arm64/install.sh
          hermes-offline-arm64/check-env.sh
          hermes-offline-arm64/README.md
          hermes-offline-arm64/requirements.lock.txt
          hermes-offline-arm64/repo/hermes-agent-src.tar.gz
          hermes-offline-arm64/MANIFEST.sha256
          hermes-offline-arm64/build-info.json
          hermes-offline-arm64/lib/libfts5_cjk.so
          hermes-offline-arm64/bin/rg
          hermes-offline-arm64/bin/uv
          hermes-offline-arm64/runtime/NODE_CHOSEN.txt
          hermes-offline-arm64/node_modules/node_modules.tar.gz
          hermes-offline-arm64/node_modules/ui-tui__node_modules.tar.gz
          hermes-offline-arm64/node_modules/web__node_modules.tar.gz
          hermes-offline-arm64/node_modules/apps__desktop__node_modules.tar.gz
          hermes-offline-arm64/node_modules/apps__shared__node_modules.tar.gz
          hermes-offline-arm64/desktop/hermes-desktop-linux-arm64.tar.gz
          "
          miss=0
          for must in $musts; do
            grep -qxF "$must" "$LIST" || { echo "✗ tar 里缺少 $must" >&2; miss=1; }
          done
          # 声明要带 Chromium 时，浏览器就必须真在包里
          if [ "$SKIP_PLAYWRIGHT" != "true" ]; then
            grep -qxF "hermes-offline-arm64/browsers/ms-playwright-arm64.tar.gz" "$LIST" \
              || { echo "✗ 声明要带 Playwright，但包里没有 browsers/ms-playwright-arm64.tar.gz" >&2; miss=1; }
          fi
          # URL 未解码的回归护栏：PBS 资产名带 `+`，release API 给的 URL 会编成
          # `%2B`；若直接拿 URL 末段当文件名，包里就会出现 `%2B` 这种编码残渣。
          if grep -qF '%2B' "$LIST"; then
            echo "✗ 包内文件名含百分号编码残留（%2B）——URL basename 忘了 unquote：" >&2
            # 用 sed -n 而不是 head：head 提前退出会让上游 grep 收到 EPIPE，
            # 再被 pipefail 变成整条流水线失败。
            grep -F '%2B' "$LIST" | sed -n '1,5p' >&2
            miss=1
          fi
          [ "$miss" -eq 0 ] || exit 1
          echo "  ✓ 关键条目齐全"

          # ── dashboard 前端必须已预编译进 repo 快照 ──
          # 目标机是零网络信创机。上游 `hermes dashboard` 找不到 dist 时会走
          # `_do_build_web_ui()`：先 `npm install --prefer-offline` 再 `npm run build`；
          # 无外网时 npm install 基本必失败，随后 sys.exit(1) —— 症状是
          # "装好了但控制台打不开"。所以 dist 必须在这里就被证实存在。
          # web_dist 藏在嵌套的源码包里，要钻进去查。
          tar -xzf "$TB" -O hermes-offline-arm64/repo/hermes-agent-src.tar.gz > "$REPO_TGZ"
          tar -tzf "$REPO_TGZ" > "$REPO_LIST"
          if ! grep -qxF 'hermes-agent/hermes_cli/web_dist/index.html' "$REPO_LIST"; then
            echo "✗ 源码包里没有 hermes_cli/web_dist/index.html —— dashboard 前端未预编译" >&2
            echo "  （目标机将需要现场 npm 构建，离线环境下会失败）" >&2
            miss=1
          fi
          WEB_ASSETS=$(grep -cE '^hermes-agent/hermes_cli/web_dist/assets/.*\.(js|css)$' "$REPO_LIST" || true)
          if [ "${WEB_ASSETS:-0}" -eq 0 ]; then
            echo "✗ web_dist/assets 下没有 js/css —— 前端产物不完整" >&2
            miss=1
          fi
          [ "$miss" -eq 0 ] || exit 1
          echo "  ✓ dashboard 前端已预编译（web_dist/assets 有 $WEB_ASSETS 个 js/css）"

          # ── Hermes Desktop 必须已预打包 ──
          # 目标机零网络。上游 `hermes desktop` 找不到 unpacked 产物时会 npm ci，
          # 再让 electron-builder 经 @electron/get 下载 Electron 运行时（~110 MiB），
          # 离线必失败。产物单独放在 desktop/*.tar.gz，不在源码快照里 ——
          # 所以要把它取出来再列一遍才看得见（和 repo 快照同一个套路）。
          tar -xzf "$TB" -O hermes-offline-arm64/desktop/hermes-desktop-linux-arm64.tar.gz > "$DT_TGZ"
          tar -tzf "$DT_TGZ" > "$DT_LIST"
          if ! grep -qE '(^|/)linux-(arm64-)?unpacked/(hermes|Hermes)$' "$DT_LIST"; then
            echo "✗ desktop tarball 里没有 unpacked 可执行文件 —— 桌面版没打进包" >&2
            miss=1
          fi
          if ! grep -qE 'app\.asar\.unpacked/dist/index\.html$' "$DT_LIST"; then
            echo "✗ desktop tarball 里没有 renderer 产物 —— --skip-build 起来是白窗口" >&2
            miss=1
          fi
          DT_NODES=$(grep -cE 'app\.asar\.unpacked/.*\.node$' "$DT_LIST" || true)
          if [ "${DT_NODES:-0}" -eq 0 ]; then
            echo "✗ desktop tarball 里没有原生模块 —— 内嵌终端（node-pty）会不可用" >&2
            miss=1
          fi
          [ "$miss" -eq 0 ] || exit 1
          echo "  ✓ 桌面版已预打包（unpacked 树 + renderer + $DT_NODES 个原生模块）"

          # ── 依赖树不许在源码快照里重复 ──
          # node_modules 只由 bundle/node_modules/*.tar.gz 携带。REPO_EXCLUDES 一旦
          # 漏了它，源码快照里会再塞进一整棵依赖树（实测 8863 个文件，占了 src
          # tarball 的绝大部分）——包白胖一圈，装的时候还会被 install.sh 第 6 步
          # 判定"已存在，跳过"而静默用错的那一份。
          # 注意这里 grep 读的是普通文件（$REPO_LIST），不是管道末端，
          # 所以不存在 pipefail 提前退出的问题。
          # 正则里不用 `|`：那是 test_workflow.py 的 lint 切分管道用的字符。
          if grep -qE '^hermes-agent/.*node_modules/' "$REPO_LIST"; then
            echo "✗ 源码快照里混进了 node_modules —— REPO_EXCLUDES 漏了它" >&2
            grep -E '^hermes-agent/.*node_modules/' "$REPO_LIST" | sed -n '1,3p' >&2
            miss=1
          fi
          # 桌面版同理：apps/desktop/release/ 是 npm run pack 的产物（Electron
          # 运行时本体，解包 290 MiB 量级），它由 desktop/*.tar.gz 单独携带。
          # REPO_EXCLUDES 一旦漏了它，源码快照里会再存一份一模一样的 ——
          # 症状同样是"包莫名大了几百 MB，而日志全绿"。
          if grep -qE '^hermes-agent/apps/desktop/release/' "$REPO_LIST"; then
            echo "✗ 源码快照里混进了 apps/desktop/release —— REPO_EXCLUDES 漏了它" >&2
            grep -E '^hermes-agent/apps/desktop/release/' "$REPO_LIST" | sed -n '1,3p' >&2
            miss=1
          fi
          [ "$miss" -eq 0 ] || exit 1

          # ── wheel 架构 / glibc 基线审计 ──
          # 这是「构建全绿、拷到信创机 GLIBC_2.XX not found」唯一能提前检出的
          # 一道闸。轮子标签是构建环境的事实记录：容器基线是 manylinux_2_28，
          # 所以允许的最大基线就是 glibc 输入里的 minor 号。
          glibc_minor="${GLIBC_TARGET##*.}"
          [ -n "$glibc_minor" ] || glibc_minor=28
          bad=0
          wheels_seen=0
          while IFS= read -r w; do
            wheels_seen=$((wheels_seen + 1))
            base="${w##*/}"
            # 用 bash 模式匹配而不是 `printf | grep -q`：grep -q 命中即退出，
            # 上游 printf 会吃 EPIPE，pipefail 下一样把脚本带崩。
            if [[ "$base" != *_aarch64.whl && "$base" != *none-any.whl ]]; then
              echo "✗ 非 aarch64 的 wheel: $base" >&2
              bad=1
            fi
            v=$(printf '%s\n' "$base" \
                  | sed -n 's/.*manylinux_2_\([0-9][0-9]*\)_aarch64.*/\1/p' \
                  | sort -n | tail -1)
            if [ -n "$v" ] && [ "$v" -gt "$glibc_minor" ]; then
              echo "✗ glibc 基线过高：manylinux_2_$v > 2.$glibc_minor  ($base)" >&2
              bad=1
            fi
          done < <(grep -E '\.whl$' "$LIST" || true)
          echo "  wheel 数: $wheels_seen"
          [ "$bad" -eq 0 ] || exit 1
          echo "  ✓ wheel 全部 aarch64，且 glibc 基线不超过 2.$glibc_minor"

          SHA=$(sha256sum "$TB" | awk '{print $1}')
          SIZE=$(du -h "$TB" | cut -f1)
          {
            echo "## Hermes Agent 离线包（ARM64）构建结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| tar.gz sha256 | \`$SHA\` |"
            echo "| tar.gz 大小 | $SIZE |"
            echo "| 条目总数 | $N |"
            echo "| wheel 数 | $(find dist/hermes-offline-arm64 -name '*.whl' \| wc -l) |"
            echo "| dashboard 前端 | 已预编译（hermes_cli/web_dist，离线免 npm） |"
            echo "| 桌面版 | 已预打包（desktop/hermes-desktop-linux-arm64.tar.gz，离线免 npm） |"
            echo ""
            echo "构建信息："
            echo '```json'
            cat dist/hermes-offline-arm64/build-info.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传离线包
        uses: actions/upload-artifact@v4
        with:
          name: hermes-offline-arm64-tarball
          path: dist/hermes-offline-arm64.tar.gz
          # 已经是 gzip 了，再压一遍纯属浪费时间和 CPU
          compression-level: 0
          retention-days: 30

      - name: 构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            dist/logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: 发布 Release（仅打 bundle-* 标签时）
        if: startsWith(github.ref, 'refs/tags/bundle-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TB=dist/hermes-offline-arm64.tar.gz
          gh release create "${GITHUB_REF_NAME}" "$TB" \
            --title "Hermes Agent 离线包 ${GITHUB_REF_NAME}" \
            --notes "ARM64 离线安装包。校验：
          \`\`\`
          $(sha256sum "$TB")
          \`\`\`
          安装：解压后 \`bash check-env.sh\` → \`sudo bash install.sh\`" \
            --generate-notes || true
